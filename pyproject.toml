[project]
name = "claude-sdk-eval"
version = "0.1.0"
description = "Insurance pricing agent (Claude Agent SDK) evaluated with Strands Evals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arize-otel>=0.14.1",
    "claude-agent-sdk>=0.2.168",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.30.0",
    "python-dotenv>=1.2.4",
    "strands-agents-evals>=1.6.0",
    "strands-agents[anthropic]>=1.61.1",
]

[project.scripts]
generate-data = "insurance_agent.generate_data:main"
run-eval = "insurance_agent.run_eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_agent"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: calls the model (needs credentials)"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
check_untyped_defs = true
ignore_missing_imports = true
